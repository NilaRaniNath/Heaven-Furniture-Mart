<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Dark Luxury Background Circle -->
  <circle cx="24" cy="24" r="23" fill="#122B2B" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Outer radiant gold ring -->
  <circle cx="24" cy="24" r="20" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" stroke-dasharray="3 2" />

  <!-- Five-pointed Crown / Crest Silhouette -->
  <path
    d="M14 30 L14 22 L18 26 L21 18 L24 24 L27 18 L30 26 L34 22 L34 30 Z"
    fill="url(#goldGrad)"
    stroke="url(#goldGrad)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  
  <!-- Crown Base Bar -->
  <rect x="13" y="30" width="22" height="2.5" rx="1.25" fill="url(#goldGrad)" />
  
  <!-- Jewels on peaks -->
  <circle cx="21" cy="17" r="1.2" fill="#F5EFE6" />
  <circle cx="24" cy="14" r="1.5" fill="#F5EFE6" />
  <circle cx="27" cy="17" r="1.2" fill="#F5EFE6" />
  
  <!-- "H" Monogram -->
  <text
    x="24"
    y="40"
    text-anchor="middle"
    fill="url(#goldGrad)"
    font-size="8.5"
    font-weight="bold"
    font-family="Playfair Display, Georgia, serif"
    letter-spacing="0.5"
  >
    H
  </text>
  
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#D4A84B" />
      <stop offset="50%" stop-color="#B8925A" />
      <stop offset="100%" stop-color="#E8C97A" />
    </linearGradient>
  </defs>
</svg>